# PostgreSQL Database for Production
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/restaurant}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Settings (stricter for production)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT Settings (use environment variables in production)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# Logging (less verbose for production)
logging.level.com.restaurant.backend=INFO
logging.level.org.springframework.security=WARN
