# PostgreSQL Database for Testing (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Settings
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Flyway disabled for tests (using Hibernate auto-create)
spring.flyway.enabled=false

# JWT Settings
app.jwt.secret=testSecretKeyForJwtTokenGenerationMinimum256BitsLongEnough
app.jwt.expiration-ms=3600000

# Logging
logging.level.com.restaurant.backend=DEBUG
